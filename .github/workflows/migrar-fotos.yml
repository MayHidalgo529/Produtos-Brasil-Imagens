0ml.png?v=1766311972&width=2000\",\"base\":\"imagens/fashion/p250-1\"},{\"id\":\"p270\",\"category\":\"fashion\",\"slot\":1,\"url\":\"https://kiyoko.ca/cdn/shop/files/SKIN1004_Centella_Tea_Trica_Relief_Ampoule_100ml.png?v=1766403401&width=2000\",\"base\":\"imagens/fashion/p270-1\"},{\"id\":\"p308\",\"category\":\"fashion\",\"slot\":1,\"url\":\"https://kiyoko.ca/cdn/shop/files/medicube-zero-pore-cream-front.png?v=1756843717&width=2000\",\"base\":\"imagens/fashion/p308-1\"},{\"id\":\"p328\",\"category\":\"fashion\",\"slot\":1,\"url\":\"https://kiyoko.ca/cdn/shop/files/Untitled_design_73.png?v=1761236499&width=2000\",\"base\":\"imagens/fashion/p328-1\"},{\"id\":\"p394\",\"category\":\"fashion\",\"slot\":1,\"url\":\"https://kiyoko.ca/cdn/shop/files/Beauty_of_Joseon_Green_Plum_Refreshing_Toner_AHA_BHA_150ml.png?v=1772989094&width=2000\",\"base\":\"imagens/fashion/p394-1\"},{\"id\":\"p401\",\"category\":\"fashion\",\"slot\":1,\"url\":\"https://kiyoko.ca/cdn/shop/files/ANUA_Heartleaf_77_Clear_Pad.png?v=1754404858&width=2000\",\"base\":\"imagens/fashion/p401-1\"},{\"id\":\"p409\",\"category\":\"fashion\",\"slot\":1,\"url\":\"https://kiyoko.ca/cdn/shop/files/Dr._Althea_PDRN_Reju_5000.png?v=1773503089&width=2000\",\"base\":\"imagens/fashion/p409-1\"}]")
          results = []
          for item in ITEMS:
              record = {'id':item['id'],'slot':item['slot'],'source':item['url']}
              try:
                  req=urllib.request.Request(item['url'],headers={'User-Agent':'Mozilla/5.0 (compatible; ProdutosBrasilImageArchive/1.0)','Accept':'image/avif,image/webp,image/png,image/jpeg,image/*;q=0.9'})
                  with urllib.request.urlopen(req,timeout=22) as response:
                      data=response.read(12000000)
                      ct=response.headers.get('Content-Type','')
                  if data[:3]==b'\xff\xd8\xff': ext='.jpg'
                  elif data[:8]==b'\x89PNG\r\n\x1a\n': ext='.png'
                  elif data[:4]==b'RIFF' and data[8:12]==b'WEBP': ext='.webp'
                  elif data.lstrip()[:4]==b'<svg' or b'<svg' in data[:500]: ext='.svg'
                  elif data[:4]==b'GIF8': ext='.gif'
                  elif data[4:8]==b'ftyp' and b'avif' in data[:24]: ext='.avif'
                  else: raise ValueError('Resposta não reconhecida como imagem: '+ct+'; bytes='+str(len(data)))
                  target=item['base']+ext
                  Path(target).parent.mkdir(parents=True,exist_ok=True)
                  Path(target).write_bytes(data)
                  record.update(ok=True,path=target,bytes=len(data))
              except Exception as exc:
                  record.update(ok=False,error=str(exc)[:240])
              results.append(record)
              print(record['id'],record['slot'],record.get('path',record.get('error')))
          Path('relatorio-migracao.json').write_text(json.dumps({'total':len(results),'ok':sum(x['ok'] for x in results),'items':results},ensure_ascii=False,indent=2))
          PY
      - name: Publicar imagens e relatório
        shell: bash
        run: |
          git config user.name "produtos-brasil-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagens relatorio-migracao.json
          if ! git diff --cached --quiet; then git commit -m "Arquiva fotos dos produtos no repositório público"; git push; fi
